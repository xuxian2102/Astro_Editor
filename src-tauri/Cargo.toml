[package]
name = "blog-editor"
version = "0.1.0"
description = "个人博客写作工具"
authors = ["xuxian"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "blog_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"
serde_yaml = "0.9"
tokio = { version = "1", features = ["process", "time", "net", "sync", "macros", "rt", "rt-multi-thread", "io-util"] }
tokio-util = "0.7"
libc = "0.2"
