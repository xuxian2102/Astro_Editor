name: Arch Wayland CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    timeout-minutes: 45

    steps:
      - name: Install Arch Linux dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git \
            nodejs \
            npm \
            rust \
            webkit2gtk-4.1 \
            curl \
            wget \
            file \
            openssl \
            appmenu-gtk-module \
            libappindicator \
            librsvg \
            sway \
            wl-clipboard \
            dbus \
            ttf-dejavu
          # Arch 给 sway 二进制附加 cap_sys_nice；GitHub 容器的 capability
          # bounding set 不含它，非 root execve 会返回 EPERM。headless pixman
          # compositor 不需要实时调度能力，只在这个隔离 CI 容器里移除。
          setcap -r /usr/bin/sway

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build Linux desktop binary
        run: pnpm tauri build --no-bundle

      - name: Build native Wayland E2E application
        run: pnpm test:e2e:build

      - name: Test native Wayland WebKitGTK desktop
        run: |
          useradd --create-home --shell /bin/bash blog-editor-e2e
          runuser --user blog-editor-e2e -- \
            env -u DISPLAY -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS \
            HOME=/home/blog-editor-e2e \
            PATH="$PATH" \
            bash test/e2e/run-wayland.sh
