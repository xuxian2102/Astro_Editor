name: Arch Wayland CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    defaults:
      run:
        shell: bash
    timeout-minutes: 45

    steps:
      - name: Install Arch Linux dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            git \
            rust \
            webkit2gtk-4.1 \
            curl \
            wget \
            file \
            openssl \
            appmenu-gtk-module \
            libappindicator \
            librsvg \
            sway \
            wl-clipboard \
            dbus \
            desktop-file-utils \
            namcap \
            ttf-dejavu
          # Arch 给 sway 二进制附加 cap_sys_nice；GitHub 容器的 capability
          # bounding set 不含它，非 root execve 会返回 EPERM。headless pixman
          # compositor 不需要实时调度能力，只在这个隔离 CI 容器里移除。
          setcap -r /usr/bin/sway
          useradd --create-home --shell /bin/bash blog-editor-ci

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false

      - name: Check Arch package metadata
        run: |
          bash -n packaging/arch/PKGBUILD
          sh -n packaging/arch/blog-editor.sh
          desktop-file-validate packaging/arch/dev.xuxian.blogeditor.desktop
          runuser --user blog-editor-ci -- \
            env \
              HOME=/home/blog-editor-ci \
              BUILDDIR=/home/blog-editor-ci/build \
              PKGDEST=/home/blog-editor-ci/packages \
              SRCDEST=/home/blog-editor-ci/sources \
              SRCPKGDEST=/home/blog-editor-ci/source-packages \
              LOGDEST=/home/blog-editor-ci/logs \
            makepkg --printsrcinfo --dir "$GITHUB_WORKSPACE/packaging/arch" \
            >/dev/null
          namcap_result=$(namcap packaging/arch/PKGBUILD)
          if [[ -n "$namcap_result" ]]; then
            printf '%s\n' "$namcap_result"
            exit 1
          fi

      - name: Test frontend
        run: pnpm test

      - name: Lint and format-check frontend
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint Rust
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Build Linux desktop binary
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: pnpm tauri build --no-bundle

      - name: Build native Wayland E2E application
        run: pnpm test:e2e:build

      - name: Test native Wayland WebKitGTK desktop
        run: |
          close_smoke_binary=""
          close_smoke_expect_file_log=0
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            close_smoke_binary=src-tauri/target/release/blog-editor
            close_smoke_expect_file_log=1
          fi
          runuser --user blog-editor-ci -- \
            env -u DISPLAY -u WAYLAND_DISPLAY -u DBUS_SESSION_BUS_ADDRESS \
            HOME=/home/blog-editor-ci \
            PATH="$PATH" \
            BLOG_EDITOR_CLOSE_SMOKE_BINARY="$close_smoke_binary" \
            BLOG_EDITOR_CLOSE_SMOKE_EXPECT_FILE_LOG="$close_smoke_expect_file_log" \
            bash test/e2e/run-wayland.sh
